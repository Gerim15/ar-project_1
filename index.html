<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="./aframe.min.js"></script>
<script src="./aframe-ar-nft.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
}

#startButton {

  position: fixed;
  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  z-index: 10000;

  padding: 20px 40px;

  font-size: 22px;

  border: none;

  border-radius: 12px;

}

#overlayVideo {

  position: fixed;

  top: 50%;
  left: 50%;

  width: 70vw;

  transform: translate(-50%, -50%);

  z-index: 9999;

  background: black;

  border-radius: 12px;

  visibility: hidden;

}

</style>

</head>

<body>

<button id="startButton">
  Start AR
</button>

<a-scene

  vr-mode-ui="enabled: false;"
  embedded

  renderer="logarithmicDepthBuffer: true;"

  arjs="
    trackingMethod: best;
    sourceType: webcam;
    debugUIEnabled: false;
  "

>

<a-nft

  type="nft"
  url="./nft/target"

  smooth="true"
  smoothCount="20"
  smoothTolerance="0.01"
  smoothThreshold="10"

>
</a-nft>

<a-entity camera></a-entity>

</a-scene>

<video

  id="overlayVideo"

  src="video.mp4"

  playsinline
  webkit-playsinline

  loop

  controls

></video>

<script>

const nft = document.querySelector("a-nft");

const video = document.querySelector("#overlayVideo");

const startButton = document.querySelector("#startButton");

let unlocked = false;

startButton.addEventListener("click", async () => {

  try {

    // Разрешаем autoplay/audio на iPhone

    video.muted = true;

    await video.play();

    video.pause();

    video.currentTime = 0;

    unlocked = true;

    startButton.style.display = "none";

  } catch(e) {

    console.log(e);

  }

});

nft.addEventListener("markerFound", async () => {

  try {

    if(unlocked) {

      video.style.visibility = "visible";

      video.muted = false;

      await video.play();

    }

  } catch(e) {

    console.log(e);

  }

});

nft.addEventListener("markerLost", () => {

  video.pause();

  video.style.visibility = "hidden";

});

</script>

</body>

</html>
