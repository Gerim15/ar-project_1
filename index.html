<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="./aframe.min.js"></script>
<script src="./aframe-ar-nft.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
}

#startButton {

  position: fixed;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  z-index: 10000;

  padding: 20px 40px;

  font-size: 22px;

  border: none;

  border-radius: 12px;

}

#overlayVideo {

  position: fixed;

  left: -9999px;
  top: -9999px;

  width: 1px;
  height: 1px;

  opacity: 0;

  pointer-events: none;

}

</style>

</head>

<body>

<button id="startButton">
  Start AR
</button>

<a-scene

  vr-mode-ui="enabled: false;"
  embedded

  renderer="
    logarithmicDepthBuffer: true;
    precision: medium;
  "

  arjs="
    trackingMethod: best;
    sourceType: webcam;
    debugUIEnabled: false;
  "

>

<a-nft

  type="nft"
  url="./nft/target"

  smooth="true"
  smoothCount="20"
  smoothTolerance="0.01"
  smoothThreshold="10"

>

<a-video

  src="#overlayVideo"

  position="0 0 0"

  rotation="-90 0 0"

  width="0.82"
  height="1.05"

></a-video>

</a-nft>

<a-entity camera></a-entity>

</a-scene>

<video

  id="overlayVideo"

  src="video.mp4"

  preload="auto"

  playsinline
  webkit-playsinline

  crossorigin="anonymous"

  loop

></video>

<script>

const nft = document.querySelector("a-nft");

const video = document.querySelector("#overlayVideo");

const startButton = document.querySelector("#startButton");

let unlocked = false;

startButton.addEventListener("click", async () => {

  try {

    video.muted = true;

    await video.play();

    video.pause();

    video.currentTime = 0;

    unlocked = true;

    startButton.style.display = "none";

  } catch(e) {

    console.log(e);

  }

});

nft.addEventListener("markerFound", async () => {

  try {

    if(unlocked) {

      video.muted = false;

      await video.play();

    }

  } catch(e) {

    console.log(e);

  }

});

nft.addEventListener("markerLost", () => {

  video.pause();

});

</script>

</body>

</html>
